<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Cards</title>
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header { text-align: center; }

    h1 {
      font-size: 2rem;
      color: #f1f5f9;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .row { display: flex; gap: 0.8rem; }
    .col { flex: 1; display: flex; flex-direction: column; gap: 0.4rem; }

    label { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; }

    select, input {
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    select:focus, input:focus { border-color: var(--accent-color); }

    button {
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      border: none;
      background-color: #0284c7;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background-color: #0369a1; }
    button:active { transform: scale(0.98); }

    .card-box {
      font-size: 1.2rem;
      line-height: 1.6;
      background: #0f172a;
      padding: 1.5rem;
      border-radius: 10px;
      border-left: 4px solid var(--accent-color);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }

    .option-btn {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      text-align: center;
    }

    .option-btn:hover {
      background-color: #1e293b;
      border-color: var(--accent-color);
    }

    .feedback-box {
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      display: none;
    }

    .feedback-box.success { border-left: 4px solid var(--accent-success); color: #86efac; }
    .feedback-box.error { border-left: 4px solid var(--accent-color); color: #fca5a5; }

    .speak-btn {
      background: #0284c7;
      border: none;
      color: #fff;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 8px;
      vertical-align: middle;
    }
    .speak-btn:hover { background: #0369a1; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vocab Cards</h1>
      <p style="color: var(--text-sub)">Interactive Learning System</p>
    </header>

    <div class="panel" id="setupPanel">
      <div class="col">
        <label>Gemini API Key (Optional)</label>
        <input type="password" id="apiKeyInput" placeholder="Paste Gemini key (or leave empty for offline mode)...">
      </div>
      <div class="row">
        <div class="col">
          <label>Theme</label>
          <select id="themeSelect">
            <option value="Culture & Art">Culture & Art</option>
            <option value="Politics & Society">Politics & Society</option>
            <option value="Geography & Nature">Geography & Nature</option>
            <option value="Business & Tech">Business & Tech</option>
            <option value="Daily Life & Psychology">Daily Life & Psychology</option>
          </select>
        </div>
        <div class="col">
          <label>Grammar Level</label>
          <select id="levelSelect">
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
            <option value="Expert">Expert</option>
          </select>
        </div>
      </div>
      <button id="startBtn">Start Learning</button>
    </div>

    <div class="panel hidden" id="cardPanel">
      <div class="card-box" id="sentenceText">Loading card...</div>

      <div class="options-grid" id="optionsContainer">
        <button class="option-btn" onclick="checkAnswer(this.textContent)">-</button>
        <button class="option-btn" onclick="checkAnswer(this.textContent)">-</button>
        <button class="option-btn" onclick="checkAnswer(this.textContent)">-</button>
        <button class="option-btn" onclick="checkAnswer(this.textContent)">-</button>
      </div>

      <div class="feedback-box" id="feedbackBox"></div>
      
      <button id="nextCardBtn" class="hidden">Next Card ➔</button>
    </div>
  </div>

  <script>
    const fallbackDatabase = [
      {
        sentence: "The heavy storm managed to _____ power supplies across the entire city.",
        missingWord: "disrupt",
        options: ["disrupt", "connect", "enhance", "maintain"],
        explanation: "Слово 'disrupt' означає порушувати нормальний хід процесу або роботи."
      },
      {
        sentence: "He was advised by his doctor because he is slightly _____ and needs more cardio.",
        missingWord: "overweight",
        options: ["fit", "overweight", "active", "slim"],
        explanation: "'Overweight' — прикметник, що означає наявність надлишкової ваги."
      },
      {
        sentence: "The ancient painting was preserved in the national _____ for decades.",
        missingWord: "museum",
        options: ["market", "factory", "museum", "station"],
        explanation: "У контексті культури та мистецтва об'єктом зберігання є музей (museum)."
      },
      {
        sentence: "Political leaders tried to _____ an agreement before the summit ended.",
        missingWord: "reach",
        options: ["break", "reach", "forget", "lose"],
        explanation: "Стійкий вираз 'to reach an agreement' (досягти угоди)."
      }
    ];

    const setupPanel = document.getElementById('setupPanel');
    const cardPanel = document.getElementById('cardPanel');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const themeSelect = document.getElementById('themeSelect');
    const levelSelect = document.getElementById('levelSelect');
    const startBtn = document.getElementById('startBtn');

    const sentenceText = document.getElementById('sentenceText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackBox = document.getElementById('feedbackBox');
    const nextCardBtn = document.getElementById('nextCardBtn');

    let currentData = null;
    let askedSentences = [];

    // Web Speech API для озвучення
    function speakWord(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Free Dictionary API для підтягування транскрипції та визначення
    async function fetchDictionaryData(word) {
      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase().trim())}`);
        if (!response.ok) return null;
        const data = await response.json();
        if (data && data.length > 0) {
          const phonetic = data[0].phonetic || (data[0].phonetics && data[0].phonetics.find(p => p.text)?.text) || '';
          const definition = data[0].meanings[0]?.definitions[0]?.definition || '';
          return { phonetic, definition };
        }
      } catch (e) {
        console.log("Dictionary API error:", e);
      }
      return null;
    }

    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) apiKeyInput.value = savedKey;

    startBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (key) localStorage.setItem('gemini_api_key', key);

      setupPanel.classList.add('hidden');
      cardPanel.classList.remove('hidden');

      askedSentences = [];
      loadNewCard();
    });

    async function loadNewCard() {
      optionsContainer.style.display = 'grid';
      feedbackBox.classList.add('hidden');
      nextCardBtn.classList.add('hidden');
      sentenceText.textContent = 'Generating card...';

      const apiKey = apiKeyInput.value.trim();
      const theme = themeSelect.value;
      const level = levelSelect.value;

      if (!apiKey) {
        useFallbackCard();
        return;
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
      const isExpert = level === 'Expert';
      const prompt = `Act as an advanced English vocabulary card generator. Generate a unique sentence with ${isExpert ? 'TWO' : 'ONE'} missing word(s) based on theme "${theme}" and level "${level}".
NEVER repeat any of these sentences: ${JSON.stringify(askedSentences)}.
Return ONLY a raw JSON object with exact keys:
- "sentence": "Sentence with _____ for the missing word."
- "missingWord": "the correct missing word"
- "options": ["option1", "option2", "option3", "option4"]
- "explanation": "Short explanation in Ukrainian."`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error('API error');

        const data = await response.json();
        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        
        currentData = JSON.parse(rawText);
        
        if (askedSentences.includes(currentData.sentence)) {
          throw new Error('Duplicate');
        }

        const dictInfo = await fetchDictionaryData(currentData.missingWord);
        if (dictInfo) {
          if (dictInfo.phonetic) currentData.explanation = `(${dictInfo.phonetic}) ${currentData.explanation}`;
          if (dictInfo.definition) currentData.explanation += `<br><em>Definition:</em> "${dictInfo.definition}"`;
        }

        askedSentences.push(currentData.sentence);
        sentenceText.textContent = currentData.sentence;
        renderOptions(currentData.options);
      } catch (err) {
        useFallbackCard();
      }
    }

    function useFallbackCard() {
      const available = fallbackDatabase.filter(item => !askedSentences.includes(item.sentence));
      if (available.length === 0) askedSentences = [];
      
      const pool = available.length > 0 ? available : fallbackDatabase;
      const randomIndex = Math.floor(Math.random() * pool.length);
      currentData = pool[randomIndex];
      
      askedSentences.push(currentData.sentence);
      sentenceText.textContent = currentData.sentence;
      renderOptions(currentData.options);
    }

    function renderOptions(options) {
      const buttons = optionsContainer.querySelectorAll('.option-btn');
      options.forEach((opt, index) => {
        if (buttons[index]) {
          buttons[index].textContent = opt;
          buttons[index].disabled = false;
        }
      });
    }

    function checkAnswer(selectedWord) {
      if (!currentData) return;
      
      optionsContainer.style.display = 'none';
      feedbackBox.classList.remove('hidden');

      const userAns = selectedWord.trim().toLowerCase();
      const correctAns = currentData.missingWord.toLowerCase();

      if (userAns === correctAns) {
        feedbackBox.className = 'feedback-box success';
        sentenceText.innerHTML = currentData.sentence.replace('_____', `<b style="color: var(--accent-color); text-decoration: underline;">${currentData.missingWord}</b> <button class="speak-btn" onclick="speakWord('${currentData.missingWord}')">🔊 Listen</button>`);
        speakWord(currentData.missingWord);

        feedbackBox.innerHTML = `<strong>Correct!</strong><br>${currentData.explanation}`;
        nextCardBtn.classList.remove('hidden');
      } else {
        feedbackBox.className = 'feedback-box error';
        feedbackBox.innerHTML = `<strong>Incorrect.</strong> The correct word was: <b>${currentData.missingWord}</b>.<br>${currentData.explanation}`;
        nextCardBtn.classList.remove('hidden');
      }
    }

    nextCardBtn.addEventListener('click', () => {
      loadNewCard();
    });
  </script>
</body>
</html>
