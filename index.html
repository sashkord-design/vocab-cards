<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Cards (Free Dictionary + Edit & Audio)</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-back: #f1f5f9;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      margin-bottom: 0.3rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .controls {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
    }

    .share-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding-top: 0.8rem;
      border-top: 1px dashed var(--border-color);
    }

    input[type="text"], textarea {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
    }

    textarea {
      resize: vertical;
      font-family: inherit;
    }

    button {
      padding: 0.8rem 1.6rem;
      border-radius: 10px;
      border: none;
      background-color: var(--accent-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-small {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      perspective: 1000px;
    }

    .card {
      height: 350px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    .card-front {
      background-color: var(--card-bg);
    }

    .card-front h2 {
      font-size: 1.8rem;
      color: var(--text-main);
      word-break: break-word;
      margin-bottom: 0.5rem;
    }

    .card-front .hint {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 600;
    }

    .card-back {
      background-color: var(--card-back);
      color: var(--text-main);
      transform: rotateY(180deg);
      text-align: left;
      align-items: flex-start;
      justify-content: space-between;
      overflow-y: auto;
    }

    .card-back .top-info {
      width: 100%;
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.2rem;
    }

    .card-back .word-header {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .speak-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .speak-btn:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .card-back .meta {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-style: italic;
      margin-bottom: 0.6rem;
    }

    .card-back .definition {
      font-size: 0.9rem;
      margin-bottom: 0.6rem;
      line-height: 1.3;
    }

    .card-back .example {
      font-size: 0.85rem;
      background-color: #ffffff;
      padding: 0.5rem;
      border-left: 3px solid var(--accent-color);
      border-radius: 6px;
      line-height: 1.3;
      border: 1px solid var(--border-color);
      border-left-width: 3px;
      margin-bottom: 0.5rem;
    }

    .action-btns {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      transition: color 0.2s;
    }

    .icon-btn.edit:hover { color: var(--accent-color); }
    .icon-btn.delete:hover { color: #ef4444; font-size: 1.4rem; }

    .edit-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
    }

    .edit-form textarea {
      font-size: 0.85rem;
      padding: 0.4rem;
    }

    .edit-actions {
      display: flex;
      gap: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vocab Cards</h1>
      <p style="color: var(--text-sub)">Powered by Free Dictionary API & Natural Audio</p>
    </header>

    <div class="controls">
      <div class="input-group">
        <input type="text" id="wordInput" placeholder="Enter a new English word or phrase...">
        <button id="addBtn">Add Card</button>
      </div>

      <div class="share-group">
        <button id="exportBtn" class="btn-small btn-secondary">📥 Export Cards</button>
        <button id="importBtn" class="btn-small btn-secondary">📤 Import Cards</button>
        <input type="file" id="importInput" accept=".json" style="display: none;">
      </div>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <script>
    const wordInput = document.getElementById('wordInput');
    const addBtn = document.getElementById('addBtn');
    const cardsGrid = document.getElementById('cardsGrid');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importInput = document.getElementById('importInput');

    let cards = JSON.parse(localStorage.getItem('vocab_cards_free_api_v1') || '[]');
    let voices = [];

    function loadVoices() {
      if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
      }
    }
    loadVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakText(text, event) {
      if (event) event.stopPropagation();
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.95;

      if (voices.length === 0) loadVoices();
      
      const preferredVoice = voices.find(v => 
        v.lang === 'en-US' && (v.name.includes('Google US English') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Natural') || v.name.includes('Female'))
      ) || voices.find(v => v.lang.startsWith('en'));

      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function renderCards() {
      cardsGrid.innerHTML = '';
      cards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.innerHTML = `
          <div class="card-inner" id="card-inner-${index}">
            
            <!-- Лицьова сторона -->
            <div class="card-front" onclick="this.closest('.card').classList.toggle('flipped')">
              <h2>${card.word}</h2>
              <button class="speak-btn" onclick="speakText('${card.word.replace(/'/g, "\\'")}', event)" title="Listen pronunciation">🔊</button>
              <span class="hint">Click to flip</span>
            </div>

            <!-- Зворотна сторона -->
            <div class="card-back" id="card-back-${index}" onclick="this.closest('.card').classList.toggle('flipped')">
              <div class="action-btns">
                <button class="icon-btn edit" onclick="event.stopPropagation(); toggleEdit(${index})" title="Edit card">✏️</button>
                <button class="icon-btn delete" onclick="event.stopPropagation(); deleteCard(${index})" title="Delete card">&times;</button>
              </div>

              <div class="top-info" id="card-content-${index}" style="width: 100%;" onclick="event.stopPropagation()">
                <div class="card-header-row">
                  <div class="word-header">${card.word}</div>
                  <button class="speak-btn" onclick="speakText('${card.word.replace(/'/g, "\\'")}', event)" title="Listen pronunciation">🔊</button>
                </div>
                <div class="meta">${card.partOfSpeech || ''} ${card.phonetic ? `• ${card.phonetic}` : ''}</div>
                <div class="definition"><strong>Meaning:</strong> ${card.definition}</div>
                ${card.example ? `<div class="example">"${card.example}"</div>` : ''}
              </div>
            </div>

          </div>
        `;
        cardsGrid.appendChild(cardEl);
      });
    }

    function toggleEdit(index) {
      const contentDiv = document.getElementById(`card-content-${index}`);
      const cardEl = document.getElementById(`card-inner-${index}`).parentElement;
      
      if (!cardEl.classList.contains('flipped')) {
        cardEl.classList.add('flipped');
      }

      const card = cards[index];

      contentDiv.innerHTML = `
        <div class="edit-form" onclick="event.stopPropagation()">
          <label style="font-size:0.75rem; color:var(--text-sub);">Meaning:</label>
          <textarea id="edit-def-${index}" rows="3">${card.definition || ''}</textarea>
          <label style="font-size:0.75rem; color:var(--text-sub);">Example:</label>
          <textarea id="edit-ex-${index}" rows="2">${card.example || ''}</textarea>
          <div class="edit-actions">
            <button class="btn-small" onclick="saveEdit(${index})">Save</button>
            <button class="btn-small btn-secondary" onclick="renderCards()">Cancel</button>
          </div>
        </div>
      `;
    }

    function saveEdit(index) {
      const newDef = document.getElementById(`edit-def-${index}`).value.trim();
      const newEx = document.getElementById(`edit-ex-${index}`).value.trim();

      cards[index].definition = newDef;
      cards[index].example = newEx;

      localStorage.setItem('vocab_cards_free_api_v1', JSON.stringify(cards));
      renderCards();
    }

    function deleteCard(index) {
      cards.splice(index, 1);
      localStorage.setItem('vocab_cards_free_api_v1', JSON.stringify(cards));
      renderCards();
    }

    async function fetchWordDetails(word) {
      const endpoint = `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase().trim())}`;
      
      const response = await fetch(endpoint);
      if (!response.ok) {
        throw new Error('Word not found in the dictionary.');
      }

      const data = await response.json();
      if (!data || data.length === 0) {
        throw new Error('No definition found for this word.');
      }

      const entry = data[0];
      const phonetic = entry.phonetic || (entry.phonetics && entry.phonetics.find(p => p.text)?.text) || '';
      const meaning = entry.meanings[0] || {};
      const partOfSpeech = meaning.partOfSpeech || '';
      const definitionObj = meaning.definitions && meaning.definitions[0] ? meaning.definitions[0] : {};
      
      const definition = definitionObj.definition || 'No definition available.';
      const example = definitionObj.example || '';

      return {
        word: entry.word || word,
        phonetic,
        partOfSpeech,
        definition,
        example
      };
    }

    wordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        addBtn.click();
      }
    });

    addBtn.addEventListener('click', async () => {
      const word = wordInput.value.trim();
      if (!word) return alert('Please enter a word.');

      addBtn.disabled = true;
      addBtn.textContent = 'Searching...';

      try {
        const cardData = await fetchWordDetails(word);
        cards.unshift(cardData);
        localStorage.setItem('vocab_cards_free_api_v1', JSON.stringify(cards));
        renderCards();
        wordInput.value = '';
      } catch (err) {
        alert('Помилка: ' + err.message);
        console.error(err);
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = 'Add Card';
      }
    });

    exportBtn.addEventListener('click', () => {
      if (cards.length === 0) return alert('Немає карток для експорту.');
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cards, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "my-vocab-cards.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    importBtn.addEventListener('click', () => {
      importInput.click();
    });

    importInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const importedCards = JSON.parse(event.target.result);
          if (Array.isArray(importedCards)) {
            cards = [...importedCards, ...cards];
            localStorage.setItem('vocab_cards_free_api_v1', JSON.stringify(cards));
            renderCards();
            alert('Картки успішно імпортовано!');
          } else {
            alert('Невірно сформований файл карток.');
          }
        } catch (err) {
          alert('Помилка читання файлу.');
        }
      };
      reader.readAsText(file);
      importInput.value = '';
    });

    renderCards();
  </script>
</body>
</html>
