<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Cards (Gemini + Audio)</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-back: #f1f5f9;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      margin-bottom: 0.3rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .controls {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    .api-key-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .api-key-row input {
      padding: 0.5rem 0.8rem;
      font-size: 0.85rem;
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
    }

    .share-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding-top: 0.8rem;
      border-top: 1px dashed var(--border-color);
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
    }

    button {
      padding: 0.8rem 1.6rem;
      border-radius: 10px;
      border: none;
      background-color: var(--accent-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-small {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      perspective: 1000px;
    }

    .card {
      height: 330px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    .card-front {
      background-color: var(--card-bg);
    }

    .card-front h2 {
      font-size: 1.8rem;
      color: var(--text-main);
      word-break: break-word;
      margin-bottom: 0.5rem;
    }

    .card-front .hint {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 600;
    }

    .card-back {
      background-color: var(--card-back);
      color: var(--text-main);
      transform: rotateY(180deg);
      text-align: left;
      align-items: flex-start;
      justify-content: space-between;
      overflow-y: auto;
    }

    .card-back .top-info {
      width: 100%;
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.2rem;
    }

    .card-back .word-header {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .speak-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .speak-btn:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .card-back .meta {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-style: italic;
      margin-bottom: 0.8rem;
    }

    .card-back .definition {
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
      line-height: 1.4;
    }

    .card-back .example {
      font-size: 0.85rem;
      background-color: #ffffff;
      padding: 0.6rem;
      border-left: 3px solid var(--accent-color);
      border-radius: 6px;
      line-height: 1.3;
      border: 1px solid var(--border-color);
      border-left-width: 3px;
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 10;
      padding: 0.2rem 0.5rem;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vocab Cards</h1>
      <p style="color: var(--text-sub)">Powered by Gemini API & Audio Pronunciation</p>
    </header>

    <div class="controls">
      <div class="api-key-row">
        <label for="apiKey">Gemini API Key:</label>
        <input type="password" id="apiKey" placeholder="Paste your free key here...">
        <button id="saveKeyBtn" class="btn-small">Save</button>
      </div>

      <div class="input-group">
        <input type="text" id="wordInput" placeholder="Enter a new English word or phrase...">
        <button id="addBtn">Add Card</button>
      </div>

      <div class="share-group">
        <button id="exportBtn" class="btn-small btn-secondary">📥 Export Cards</button>
        <button id="importBtn" class="btn-small btn-secondary">📤 Import Cards</button>
        <input type="file" id="importInput" accept=".json" style="display: none;">
      </div>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const wordInput = document.getElementById('wordInput');
    const addBtn = document.getElementById('addBtn');
    const cardsGrid = document.getElementById('cardsGrid');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importInput = document.getElementById('importInput');

    let cards = JSON.parse(localStorage.getItem('vocab_cards_gemini_v3') || '[]');

    const savedKey = localStorage.getItem('gemini_api_key') || '';
    if (savedKey) apiKeyInput.value = savedKey;

    saveKeyBtn.addEventListener('click', () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
      alert('API Key saved successfully!');
    });

    function speakText(text, event) {
      if (event) event.stopPropagation();
      if (!('speechSynthesis' in window)) {
        alert('Text-to-speech is not supported in your browser.');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }

    function renderCards() {
      cardsGrid.innerHTML = '';
      cards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.innerHTML = `
          <div class="card-inner" onclick="this.parentElement.classList.toggle('flipped')">
            <button class="delete-btn" onclick="event.stopPropagation(); deleteCard(${index})">&times;</button>
            <div class="card-front">
              <h2>${card.word}</h2>
              <button class="speak-btn" onclick="speakText('${card.word.replace(/'/g, "\\'")}', event)" title="Listen pronunciation">🔊</button>
              <span class="hint">Click to flip</span>
            </div>
            <div class="card-back">
              <div class="top-info">
                <div class="card-header-row">
                  <div class="word-header">${card.word}</div>
                  <button class="speak-btn" onclick="speakText('${card.word.replace(/'/g, "\\'")}', event)" title="Listen pronunciation">🔊</button>
                </div>
                <div class="meta">${card.partOfSpeech || ''} ${card.phonetic ? `• ${card.phonetic}` : ''}</div>
                <div class="definition"><strong>Meaning:</strong> ${card.definition}</div>
                ${card.example ? `<div class="example">"${card.example}"</div>` : ''}
              </div>
            </div>
          </div>
        `;
        cardsGrid.appendChild(cardEl);
      });
    }

    function deleteCard(index) {
      cards.splice(index, 1);
      localStorage.setItem('vocab_cards_gemini_v3', JSON.stringify(cards));
      renderCards();
    }

    async function fetchWordDetails(word, apiKey) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
      
      const prompt = `Act as an advanced English dictionary. Provide details for the English word or phrase "${word}".
Return ONLY a raw JSON object (without markdown code blocks, backticks, or any conversational filler) with these exact keys:
- "word": "${word}"
- "phonetic": "IPA pronunciation (e.g. /əˈbɪk.wɪ.təs/)"
- "partOfSpeech": "part of speech (e.g. noun, verb, adjective)"
- "definition": "a clear, simple, and precise explanation of the word in English"
- "example": "a natural, clear example sentence using the word"`;

      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`API Error (${response.status}): ${errText}`);
      }

      const data = await response.json();
      let rawText = data.candidates[0].content.parts[0].text;
      
      rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      return JSON.parse(rawText);
    }

    wordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        addBtn.click();
      }
    });

    addBtn.addEventListener('click', async () => {
      const word = wordInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!word) return alert('Please enter a word.');
      if (!apiKey) return alert('Please enter and save your Gemini API Key first.');

      addBtn.disabled = true;
      addBtn.textContent = 'Generating...';

      try {
        const cardData = await fetchWordDetails(word, apiKey);
        cards.unshift(cardData);
        localStorage.setItem('vocab_cards_gemini_v3', JSON.stringify(cards));
        renderCards();
        wordInput.value = '';
      } catch (err) {
        alert('Помилка: ' + err.message);
        console.error(err);
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = 'Add Card';
      }
    });

    exportBtn.addEventListener('click', () => {
      if (cards.length === 0) return alert('Немає карток для експорту.');
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cards, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "my-vocab-cards.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    importBtn.addEventListener('click', () => {
      importInput.click();
    });

    importInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const importedCards = JSON.parse(event.target.result);
          if (Array.isArray(importedCards)) {
            cards = [...importedCards, ...cards];
            localStorage.setItem('vocab_cards_gemini_v3', JSON.stringify(cards));
            renderCards();
            alert('Картки успішно імпортовано!');
          } else {
            alert('Невірно сформований файл карток.');
          }
        } catch (err) {
          alert('Помилка читання файлу.');
        }
      };
      reader.readAsText(file);
      importInput.value = '';
    });

    renderCards();
  </script>
</body>
</html>
