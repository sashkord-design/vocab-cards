<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Cards (Free Dictionary + Editable)</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-back: #f1f5f9;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      margin-bottom: 0.3rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .controls {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
    }

    .share-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding-top: 0.8rem;
      border-top: 1px dashed var(--border-color);
    }

    input[type="text"] {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
    }

    button {
      padding: 0.8rem 1.6rem;
      border-radius: 10px;
      border: none;
      background-color: var(--accent-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-small {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      perspective: 1000px;
    }

    .card {
      height: 350px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    .card-front {
      background-color: var(--card-bg);
    }

    .card-front h2 {
      font-size: 1.8rem;
      color: var(--text-main);
      word-break: break-word;
      margin-bottom: 0.5rem;
    }

    .card-front .hint {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 600;
    }

    .card-back {
      background-color: var(--card-back);
      color: var(--text-main);
      transform: rotateY(180deg);
      text-align: left;
      align-items: flex-start;
      justify-content: space-between;
      overflow-y: auto;
    }

    .card-back .top-info {
      width: 100%;
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.2rem;
    }

    .card-back .word-header {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .action-buttons {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }

    .speak-btn, .edit-btn {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .speak-btn:hover, .edit-btn:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .card-back .meta {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-style: italic;
      margin-bottom: 0.8rem;
    }

    .card-back .definition {
      font-size: 0.9rem;
      margin-bottom: 0.8rem;
      line-height: 1.3;
    }

    .card-back .example {
      font-size: 0.82rem;
      background-color: #ffffff;
      padding: 0.6rem;
      border-left: 3px solid var(--accent-color);
      border-radius: 6px;
      line-height: 1.3;
      border: 1px solid var(--border-color);
      border-left-width: 3px;
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 10;
      padding: 0.2rem 0.5rem;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: #ef4444;
    }

    /* Модальне вікно для редагування */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #fff;
      padding: 2rem;
      border-radius: 14px;
      width: 90%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-content h3 { color: var(--accent-color); }
    .modal-content label { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; }
    .modal-content input, .modal-content textarea {
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
      outline: none;
      width: 100%;
    }
    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vocab Cards</h1>
      <p style="color: var(--text-sub)">Free Dictionary API & Native Audio</p>
    </header>

    <div class="controls">
      <div class="input-group">
        <input type="text" id="wordInput" placeholder="Enter a new English word (instant add)...">
        <button id="addBtn">Add Card</button>
      </div>

      <div class="share-group">
        <button id="exportBtn" class="btn-small btn-secondary">📥 Export Cards</button>
        <button id="importBtn" class="btn-small btn-secondary">📤 Import Cards</button>
        <input type="file" id="importInput" accept=".json" style="display: none;">
      </div>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <!-- Модальне вікно редагування -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>Edit Card</h3>
      <div>
        <label>Word / Phrase</label>
        <input type="text" id="editWord">
      </div>
      <div>
        <label>Part of Speech & Phonetic</label>
        <input type="text" id="editMeta">
      </div>
      <div>
        <label>Definition</label>
        <textarea id="editDefinition" rows="2"></textarea>
      </div>
      <div>
        <label>Example</label>
        <textarea id="editExample" rows="2"></textarea>
      </div>
      <div class="modal-buttons">
        <button id="cancelEdit" class="btn-small btn-secondary">Cancel</button>
        <button id="saveEdit" class="btn-small">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const wordInput = document.getElementById('wordInput');
    const addBtn = document.getElementById('addBtn');
    const cardsGrid = document.getElementById('cardsGrid');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importInput = document.getElementById('importInput');

    const editModal = document.getElementById('editModal');
    const editWord = document.getElementById('editWord');
    const editMeta = document.getElementById('editMeta');
    const editDefinition = document.getElementById('editDefinition');
    const editExample = document.getElementById('editExample');
    const cancelEdit = document.getElementById('cancelEdit');
    const saveEdit = document.getElementById('saveEdit');

    let currentEditIndex = null;
    let cards = JSON.parse(localStorage.getItem('vocab_cards_free_v1') || '[]');

    // Озвучення через реальні аудіодоріжки словника (або якісний синтезатор як бекап)
    async function speakText(text, event) {
      if (event) event.stopPropagation();
      const cleanWord = text.trim().toLowerCase().split(' ')[0];

      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${cleanWord}`);
        if (!response.ok) throw new Error('Audio not found');
        
        const data = await response.json();
        let audioUrl = '';

        for (const entry of data) {
          if (entry.phonetics) {
            const found = entry.phonetics.find(p => p.audio && p.audio.trim() !== '');
            if (found) {
              audioUrl = found.audio;
              break;
            }
          }
        }

        if (audioUrl) {
          const audio = new Audio(audioUrl);
          await audio.play();
          return;
        }
        throw new Error('No audio');
      } catch (err) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.95;
          window.speechSynthesis.speak(utterance);
        } else {
          alert('Audio unavailable.');
        }
      }
    }

    function renderCards() {
      cardsGrid.innerHTML = '';
      cards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.innerHTML = `
          <div class="card-inner" onclick="this.parentElement.classList.toggle('flipped')">
            <button class="delete-btn" onclick="event.stopPropagation(); deleteCard(${index})" title="Delete">&times;</button>
            <div class="card-front">
              <h2>${card.word}</h2>
              <button class="speak-btn" onclick="speakText('${card.word.replace(/'/g, "\\'")}', event)" title="Listen pronunciation">🔊</button>
              <span class="hint">Click to flip</span>
            </div>
            <div class="card-back">
              <div class="top-info">
                <div class="card-header-row">
                  <div class="word-header">${card.word}</div>
                  <div class="action-buttons">
                    <button class="edit-btn" onclick="event.stopPropagation(); openEditModal(${index})" title="Edit card">✏️</button>
                    <button class="speak-btn" onclick="speakText('${card.word.replace(/'/g, "\\'")}', event)" title="Listen pronunciation">🔊</button>
                  </div>
                </div>
                <div class="meta">${card.partOfSpeech || ''} ${card.phonetic ? `• ${card.phonetic}` : ''}</div>
                <div class="definition"><strong>Meaning:</strong> ${card.definition}</div>
                ${card.example ? `<div class="example">"${card.example}"</div>` : ''}
              </div>
            </div>
          </div>
        `;
        cardsGrid.appendChild(cardEl);
      });
    }

    function deleteCard(index) {
      cards.splice(index, 1);
      localStorage.setItem('vocab_cards_free_v1', JSON.stringify(cards));
      renderCards();
    }

    function openEditModal(index) {
      currentEditIndex = index;
      const card = cards[index];
      editWord.value = card.word || '';
      editMeta.value = `${card.partOfSpeech || ''} ${card.phonetic || ''}`.trim();
      editDefinition.value = card.definition || '';
      editExample.value = card.example || '';
      editModal.style.display = 'flex';
    }

    cancelEdit.addEventListener('click', () => {
      editModal.style.display = 'none';
    });

    saveEdit.addEventListener('click', () => {
      if (currentEditIndex !== null) {
        cards[currentEditIndex].word = editWord.value.trim();
        cards[currentEditIndex].partOfSpeech = editMeta.value;
        cards[currentEditIndex].definition = editDefinition.value.trim();
        cards[currentEditIndex].example = editExample.value.trim();
        localStorage.setItem('vocab_cards_free_v1', JSON.stringify(cards));
        renderCards();
        editModal.style.display = 'none';
      }
    });

    // Автоматичне заповнення через безкоштовний словник
    async function fetchWordDetails(word) {
      const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
      if (!response.ok) {
        throw new Error('Word not found in Free Dictionary API.');
      }
      const data = await response.json();
      const entry = data[0];
      
      const phonetic = entry.phonetic || (entry.phonetics && entry.phonetics.find(p => p.text)?.text) || '';
      const meaning = entry.meanings[0];
      const partOfSpeech = meaning ? meaning.partOfSpeech : '';
      const definitionObj = meaning && meaning.definitions ? meaning.definitions[0] : {};
      
      const definition = definitionObj.definition || 'No definition available.';
      const example = definitionObj.example || '';

      return {
        word: entry.word,
        phonetic: phonetic,
        partOfSpeech: partOfSpeech,
        definition: definition,
        example: example
      };
    }

    wordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addBtn.click();
    });

    addBtn.addEventListener('click', async () => {
      const word = wordInput.value.trim();
      if (!word) return alert('Please enter a word.');

      addBtn.disabled = true;
      addBtn.textContent = 'Loading...';

      try {
        const cardData = await fetchWordDetails(word);
        cards.unshift(cardData);
        localStorage.setItem('vocab_cards_free_v1', JSON.stringify(cards));
        renderCards();
        wordInput.value = '';
      } catch (err) {
        // Якщо слова немає в базі словника, створюємо базову картку вручну, щоб користувач міг її відредагувати
        cards.unshift({
          word: word,
          phonetic: '',
          partOfSpeech: 'custom',
          definition: 'Definition not found automatically. Click edit to add.',
          example: ''
        });
        localStorage.setItem('vocab_cards_free_v1', JSON.stringify(cards));
        renderCards();
        wordInput.value = '';
        alert('Слово додано, але опис не знайдено автоматично. Можете відредагувати його кнопкою ✏️.');
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = 'Add Card';
      }
    });

    exportBtn.addEventListener('click', () => {
      if (cards.length === 0) return alert('Немає карток для експорту.');
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cards, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "my-vocab-cards.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    importBtn.addEventListener('click', () => importInput.click());

    importInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.loaded = false;
      reader.onload = (event) => {
        try {
          const importedCards = JSON.parse(event.target.result);
          if (Array.isArray(importedCards)) {
            cards = [...importedCards, ...cards];
            localStorage.setItem('vocab_cards_free_v1', JSON.stringify(cards));
            renderCards();
            alert('Картки успішно імпортовано!');
          } else {
            alert('Невірно сформований файл карток.');
          }
        } catch (err) {
          alert('Помилка читання файлу.');
        }
      };
      reader.readAsText(file);
      importInput.value = '';
    });

    renderCards();
  </script>
</body>
</html>
